name: Baseline update

on:
  # 定期実行は当面止め、手動起動だけで運用する。再開するときは次を戻す。
  # schedule:
  #   # 毎週月曜 00:00 UTC
  #   - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Check the upstream document for changes
        id: fetch
        run: |
          uv run python baseline/fetch_security_doc.py --check > fetch-report.json
          cat fetch-report.json
          {
            echo "changed=$(jq -r .changed fetch-report.json)"
            echo "baseline_version=$(jq -r .baseline_version fetch-report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Update the snapshot
        if: steps.fetch.outputs.changed == 'true'
        run: uv run python baseline/fetch_security_doc.py --write

      # 要件化は判断を伴うため Claude が担当する。認証は API キーではなく
      # サブスクリプションの長期トークン（claude setup-token で発行）を使う。
      - name: Regenerate the baseline with Claude
        if: steps.fetch.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            baseline/generate.md を読み、その手順どおりに
            skills/security-audit/references/requirements.md
            を更新してください。

            守ること:
            - 変更するのは requirements.md だけ。他のファイルは触らない
            - baseline/security.md は書き換えない
            - 要件 ID を振り直さない
            - コミットやプッシュはしない。差分を作業ツリーに残すだけでよい
          claude_args: --allowed-tools "Read,Edit,Write,Glob,Grep,Bash"

      - name: Validate the regenerated baseline
        if: steps.fetch.outputs.changed == 'true'
        run: |
          uv run python baseline/validate_requirements.py \
            skills/security-audit/references/requirements.md
          npm install -g markdownlint-cli2@0.20.0
          markdownlint-cli2 "skills/**/*.md"

      # 判定基準そのものなので自動マージはしない。必ず人のレビューを通す。
      - name: Open a pull request
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: baseline-update
          delete-branch: true
          labels: baseline-update
          commit-message: "ベースラインを ${{ steps.fetch.outputs.baseline_version }} へ更新"
          title: "ベースライン更新: ${{ steps.fetch.outputs.baseline_version }}"
          body: |
            公式セキュリティドキュメントの変更を検知したため、
            `baseline/generate.md` の手順でベースラインを再生成しました。

            - 基準バージョン: `${{ steps.fetch.outputs.baseline_version }}`
            - 出典: <https://code.claude.com/docs/en/security.md>

            要件の追加・変更・廃止が妥当か、要件 ID が維持されているかを
            確認してからマージしてください。
          add-paths: |
            baseline/security.md
            skills/security-audit/references/requirements.md
